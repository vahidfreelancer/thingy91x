# Enable flash drivers and flash map
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Enable File System with LittleFS support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Enable sensor subsystem (for IMU)
CONFIG_SENSOR=y

# Enable floating point support in printf formatting (critical for GPS and attitude angles)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Base configurations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
