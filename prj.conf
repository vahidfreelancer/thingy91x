CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_PRINTK=y

# Enable MCUboot integration to allow internal USB/Serial DFU bootloader updates
CONFIG_BOOTLOADER_MCUBOOT=y

# Enable flash drivers and flash map
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Enable File System with LittleFS support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Enable I2C bus, GPIO driver, LED drivers, and sensor subsystem
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_SENSOR=y

# Enable Device Power Management
CONFIG_PM_DEVICE=y

# Enable floating point support in printf formatting (critical for GPS and attitude angles)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048