CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_PRINTK=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_PRINTK=y

# Enable MCUboot integration to allow internal USB/Serial DFU bootloader updates
CONFIG_BOOTLOADER_MCUBOOT=y

# Enable flash drivers and flash map
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Enable File System with LittleFS support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Enable I2C bus, GPIO driver, LED drivers, and sensor subsystem
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_SENSOR=y

# Enable Device Power Management
CONFIG_PM_DEVICE=y

# Enable floating point support in printf formatting (critical for GPS and attitude angles)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Cellular Modem & Network Stack (nRF Connect SDK v3.2.1)
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# Networking & Sockets API
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# nRF7002 Wi-Fi Companion IC Management
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_OFFLOAD=y
CONFIG_NRF_WIFI_SCAN_MAX_BSS_CNT=20
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=10240
CONFIG_HEAP_MEM_POOL_SIZE=12288

# DNS Resolver & Public DNS Servers
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_DNS_SERVER2="1.1.1.1"

# Packet Data Network (PDN) & APN Configuration
CONFIG_PDN=y
CONFIG_PDN_DEFAULT_APN=""

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048